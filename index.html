<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="pokemon-form" netlify>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tucorreo@dominio.com"
          required
        />
      </div>

      <div class="form-group">
        <label>Selecciona tu Pokémon Inicial</label>
        <div class="pokemon-selector">
          <input
            type="radio"
            name="pokemon"
            value="charmander"
            id="charmander"
            class="pokemon-radio"
          />
          <label for="charmander" class="pokemon-label">
            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png"
              alt="Charmander"
            />
            <span>Charmander</span>
          </label>

          <input
            type="radio"
            name="pokemon"
            value="bulbasaur"
            id="bulbasaur"
            class="pokemon-radio"
          />
          <label for="bulbasaur" class="pokemon-label">
            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png"
              alt="Bulbasaur"
            />
            <span>Bulbasaur</span>
          </label>

          <input
            type="radio"
            name="pokemon"
            value="squirtle"
            id="squirtle"
            class="pokemon-radio"
          />
          <label for="squirtle" class="pokemon-label">
            <img
              src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png"
              alt="Squirtle"
            />
            <span>Squirtle</span>
          </label>
        </div>
      </div>

      <button type="submit">Capturalo</button>
    </form>
  </body>
</html>
